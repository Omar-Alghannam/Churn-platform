version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: churn_db
    restart: "no"
    environment:
      POSTGRES_DB: churn_intelligence
      POSTGRES_USER: churnadmin
      POSTGRES_PASSWORD: churnlocal123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnadmin -d churn_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churn_pgadmin
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
